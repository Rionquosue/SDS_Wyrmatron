# Wyrmatron account whitelist. Copy to config/whitelist.cfg.
# One numeric Telegram user ID per line; text after # is a comment.
# Usernames are not accepted because they can change. To find an ID, message
# the bot from that account: it is blocked and listed in blocklist.cfg with its
# username, and moving the line here unblocks it.
# Admins from config.toml are always allowed. Changes apply without a restart.
123456789  # example
